<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Loading GenLayer">
  <title>GenLayer Loading Spinner</title>
  <defs>
    <!-- Kinetic Cobalt gradient for the orbital track -->
    <linearGradient id="gl-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110FFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#110FFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#110FFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="gl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes gl-spin-track {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes gl-pulse-core {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(0.94); opacity: 0.7; }
    }
    @keyframes gl-shard-shimmer {
      0%, 100% { fill: #110FFF; }
      50% { fill: #3835FF; }
    }
    .gl-orbit {
      transform-origin: 50px 50px;
      animation: gl-spin-track 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .gl-mark-center {
      transform-origin: 50px 50px;
      animation: gl-pulse-core 1.6s ease-in-out infinite;
    }
    .gl-shimmer {
      animation: gl-shard-shimmer 1.6s ease-in-out infinite;
    }
  </style>

  <!-- Static Track Ring (subtle background guide) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#070707" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Rotating Arc with Kinetic Cobalt comet tail -->
  <g class="gl-orbit">
    <!-- Main fast sweep -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#gl-orbit-grad)" stroke-width="3.5"
            stroke-linecap="round" stroke-dasharray="140 130" transform="rotate(-90 50 50)"/>
    <!-- Leading bright head spark -->
    <circle cx="50" cy="8" r="2.5" fill="#110FFF" filter="url(#gl-glow)"/>
  </g>

  <!-- Official GenLayer Logo Mark (Exact geometry: 97.76 x 91.93 centered & scaled to fit inside 46px box) -->
  <!-- Scaled by ~0.42 and translated so mark origin (48.88, 45.96) is at (50, 50) -->
  <g class="gl-mark-center">
    <g transform="translate(50, 50) scale(0.42) translate(-48.88, -45.96)">
      <!-- Left Wing / Shard -->
      <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"
               fill="#110FFF" class="gl-shimmer"/>
      <!-- Right Wing / Shard -->
      <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"
               fill="#110FFF" class="gl-shimmer"/>
      <!-- Center Diamond / Core Shard -->
      <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"
               fill="#070707"/>
    </g>
  </g>
</svg>
